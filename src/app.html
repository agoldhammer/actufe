<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<script>
			(function () {
				var b = (window.__boot = { s: 0, d: null });
				var n;
				b.render = function () {
					if (!b.s) return;
					if (!n) {
						n = document.createElement('div');
						n.setAttribute(
							'style',
							'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;text-align:center;background:#fff;color:#6b6b6b;font:0.9rem Verdana,sans-serif'
						);
						(document.body || document.documentElement).appendChild(n);
					}
					var f = b.s > 1;
					n.textContent = f ? 'The app didn’t finish loading. Tap to reload.' : 'Loading…';
					if (f)
						n.onclick = function () {
							location.reload();
						};
				};
				b.drop = function () {
					if (n) n.remove();
					n = null;
				};
				b.stop = function () {
					clearTimeout(t1);
					clearTimeout(t2);
				};
				var t1 = setTimeout(function () {
					if (!b.s) {
						b.s = 1;
						window.__bootSpinnerShown = true;
					}
					b.render();
				}, 500);
				var t2 = setTimeout(function () {
					b.s = 2;
					b.render();
				}, 10000);
			})();
		</script>
		<!--
			The explanation of the script above sits below it rather than in it, and
			this is the one place in the project where that is worth doing. Everything
			the app has to say about a failed launch is said by code that has to have
			arrived to say it, so the only figure that matters is how far into the
			document that code sits. The full watchdog further down used to be the
			whole of it, and it finishes parsing at 90% of the shell: measured on both
			engines, truncating one character earlier reports nothing at all. Splitting
			it moves the two timers — the only irreplaceable part, because everything
			else can be rebuilt later but a clock that was never started cannot be —
			into the first few hundred bytes, so a document that stops arriving almost
			anywhere still has something running to say so.

			The stub owns `window.__boot`: `s` (0 nothing yet, 1 loading, 2 gave up),
			`d` (a detail message from whatever failed), `render`, `drop` and `stop`.
			Its own `render` is a bare styled div, because at 500 milliseconds the
			<style> block below may not have arrived either. The watchdog replaces
			`render` with the real overlay when it parses, and calls `drop` to clear
			the fallback if the stub had already painted one.

			The two thresholds are 500ms before anything is shown — the same one
			Components/ActuStatus.svelte uses, so that a single continuous wait is not
			handed off with a blink — and 10s before the wait is called a failure.
			The <link rel="icon"> above the script is deliberately ahead of it and
			must stay there. It is a beacon: the browser requests favicon.ico the
			moment that tag parses, and favicon.ico is served no-cache, so a launch
			that does not produce that request in the nginx access log is a launch
			whose parser never reached byte ~94. That is the measurement that
			identified the failure of 13 Aug 2026, where the shell was fetched (304)
			and *nothing else* followed. Note that it only reads that way for a client
			the service worker is not yet controlling — once it is, favicon.ico is
			served from Cache Storage and never reaches nginx at all, and the log
			signal for "the app mounted" becomes the /api/articles request instead.
		-->
		<meta name="viewport" content="width=device-width" />
		<style>
			/*
				Styles for the boot skeleton, which the watchdog below builds from
				script. With `ssr = false` this file is the only markup the server
				sends, so between the first byte and the app's first render there is
				otherwise nothing on screen at all. On a phone that gap is the module
				downloads plus their execution — seconds, sometimes — and if a chunk
				never arrives it is permanent, with no error and no way out but the
				browser's own controls.

				It overlays rather than sits in the flow, so removing it can't shift the
				app's layout, and its geometry mirrors ActuStatus/.pagewrapper so the
				handoff to the app is not a visible change of shape.
			*/
			#boot {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: #fff;
				font-family: Verdana, Geneva, Tahoma, sans-serif;
				color: #333;
				/* Held back so a fast load never flashes a spinner; ActuStatus uses the
				   same threshold and picks the wait up where this leaves off. */
				opacity: 0;
				pointer-events: none;
			}

			#boot.showing {
				opacity: 1;
			}

			#boot .boot-panel {
				display: none;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				text-align: center;
				padding: 1rem;
				max-width: 800px;
			}

			#boot.showing .boot-loading,
			#boot.failed .boot-failed {
				display: flex;
			}

			/* Once we have given up, the loading panel is a lie — replace it. */
			#boot.failed {
				pointer-events: auto;
			}

			#boot.failed .boot-loading {
				display: none;
			}

			#boot p {
				margin: 0;
				font-size: 0.9rem;
				color: #6b6b6b;
			}

			#boot .boot-detail {
				font-size: 0.75rem;
				max-width: 40ch;
			}

			#boot .boot-spinner {
				width: 28px;
				height: 28px;
				border: 3px solid #c8c3c5;
				border-top-color: #9a031e;
				border-radius: 50%;
				animation: boot-spin 0.9s linear infinite;
			}

			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}

			#boot button {
				border: none;
				border-radius: 8px;
				background-color: #9a031e;
				color: #fff;
				font-size: 0.8rem;
				padding: 6px 14px;
				cursor: pointer;
			}

			@media (prefers-reduced-motion: reduce) {
				#boot .boot-spinner {
					animation: none;
				}
			}
		</style>
		<script>
			// Watchdog for the boot skeleton — the reporting half of the pair; the
			// timers are armed by the stub at the top of <head>, which is the half
			// that has to arrive.
			//
			// The app's own loading and error states (ActuStatus) can only help once
			// the app is running. Nothing else covers the case where it never starts:
			// the shell's bootstrap does `Promise.all([import(...), import(...)])
			// .then(...)`, so a single chunk that fails to load leaves that promise
			// forever pending — no error, no handler, nothing on screen.
			//
			// This builds its overlay from script rather than having it in the markup
			// because of a failure one layer below that: a phone waking on a cold
			// radio, or handing off wifi<->cellular, commits the response and then
			// loses the socket. The document has replaced whatever was on screen, so
			// the page is white, and the parser stalls partway through — possibly
			// before this script. Whatever arrives has to be able to build its own
			// DOM, and to pick up the state the stub has already reached.
			(function () {
				var b = window.__boot;

				var CHUNK_DETAIL =
					'Some of it never arrived — usually a dropped connection. Reloading normally fixes it.';
				var DOCUMENT_DETAIL =
					'The connection dropped while the page was loading. Reloading normally fixes it.';

				var boot = null;
				var detailNode = null;
				var failDetail = null;
				var finished = false;
				// Set when the overlay had to come back over a loading panel that was
				// still promising articles after they had failed — see fail() below.
				var lied = false;

				// Where the launch got to, sent to the server. Everything above is
				// for the reader; this is the half that survives the reader closing
				// the app, and it is the only account of a failure anyone will ever
				// get: the phone has no console to open and no way to report what it
				// saw beyond describing it. nginx answers /_b with a 204 and logs the
				// query string, so one launch becomes two or three lines in the
				// access log next to the /api/articles request they belong with.
				//
				// It lives here rather than in the stub on purpose. The stub is sized
				// to arrive — it is the first few hundred bytes of the document, and
				// what it buys is that a truncated document still has a clock running
				// — so nothing goes in it that does not have to. A document that dies
				// before this point is already legible in the access log without help
				// (a `GET /` with no /api/articles behind it, and — before a service
				// worker is controlling the client — no favicon.ico either). What was
				// not legible, and is what this is for, is the launch that fetches its
				// articles and then shows nothing: from outside it is indistinguishable
				// from a launch that worked.
				//
				//   m=app  the app rendered something with a height. Sent from done().
				//   m=up   a frame was produced *after* that render, so what the app
				//          built actually reached the screen. Absent means the page
				//          stopped painting, which no amount of in-page repair fixes.
				//   m=err  any error or rejection, at any point in the document's life,
				//          including long after the boot overlay has bowed out.
				//   m=end  the reader left, or the OS took the app away. Sent once per
				//          departure, and the only one that reports a launch nothing else
				//          had anything to say about. m=show is its partner.
				//   m=show the document came back. Only ever sent after an m=end, so the
				//          two read as a pair: end-then-show is a launch that was put in
				//          the background and returned to, end-with-nothing-after is one
				//          that was not. `d=bfcache` when the browser restored the page
				//          whole, which is what "I hit Back and the articles were
				//          instantly there" looks like from inside the document.
				//   m=fr   the frame sampler's window closed with the reader still here.
				//          Routine; it is the baseline that makes m=stall mean something.
				//   m=stall a *visible* document went STALL_MS without being drawn. This is
				//          the one that separates an app that died from an app that was
				//          never put on screen, which is the question left open by
				//          21:30:05Z on 18 Aug 2026: that launch reported m=app and m=up,
				//          had no error of any kind, and showed the reader plain white.
				//
				// Fields: t ms since this script parsed, s the stub's state (0/1/2),
				// v visibilityState, h whether the document was ever hidden (a phone
				// that never brought the page to the front explains a white screen by
				// itself), f frames painted, g the longest a visible document kept us
				// waiting for a frame, d a truncated detail for m=err and m=show.
				var BEACON = '%sveltekit.assets%/_b';
				var t0 = Date.now();
				var painted = 0;
				var maxGap = 0;
				var everHidden = document.visibilityState === 'hidden';
				var ended = false;

				function report(m, detail) {
					var q =
						'?m=' +
						m +
						'&t=' +
						(Date.now() - t0) +
						'&s=' +
						b.s +
						'&v=' +
						document.visibilityState.charAt(0) +
						'&h=' +
						(everHidden ? 1 : 0) +
						'&f=' +
						painted +
						'&g=' +
						maxGap;
					if (detail) q += '&d=' + encodeURIComponent(String(detail).slice(0, 120));
					try {
						// sendBeacon survives the unload m=end is sent during; the image
						// is for anything that has not got it. Neither is allowed to be
						// the thing that breaks a launch, hence the try.
						if (navigator.sendBeacon) navigator.sendBeacon(BEACON + q);
						else new Image().src = BEACON + q;
					} catch (e) {
						/* nothing to report the reporter to */
					}
				}

				// The frame sampler.
				//
				// m=up proves that one frame followed the app's first render. It cannot
				// prove the page went on being drawn, and that is exactly the gap the
				// 18 Aug 2026 failure fell through: the app rendered, a frame was
				// produced, both were reported, no error was raised anywhere, and the
				// reader sat looking at white until Back brought the articles up
				// instantly. A document cannot see its own pixels, but it can ask for a
				// frame and time how long the answer takes — and a *visible* document
				// that is not being drawn is the one thing no in-page repair can fix,
				// so it is worth being able to name.
				//
				// Sampled at 5Hz rather than run flat out. The answer is the same, the
				// cost is nothing, and asking for a frame is also a reason to produce
				// one — which may keep the compositor from settling across the handoff
				// from the launcher's splash screen, where the surface is suspected of
				// being lost. Bounded to the launch, because the earlier objection to a
				// standing rAF loop stands: over the life of the page it would be a
				// battery drain kept alive purely to measure itself.
				var FRAME_SAMPLE_MS = 200;
				var FRAME_WINDOW_MS = 15000;
				// Three samples' worth, and ~90 missed frames at 60Hz: long enough that a
				// phone busy parsing the articles is not accused of having stopped.
				var STALL_MS = 1500;
				var sampling = true;
				var awaitingFrame = false;
				var frameAskedAt = Date.now();
				var stallReported = false;

				function noteGap() {
					var gap = Date.now() - frameAskedAt;
					if (gap > maxGap) maxGap = gap;
				}

				function askForFrame() {
					if (!sampling) return;
					awaitingFrame = true;
					frameAskedAt = Date.now();
					requestAnimationFrame(function () {
						if (!awaitingFrame) return;
						awaitingFrame = false;
						painted++;
						noteGap();
						setTimeout(askForFrame, FRAME_SAMPLE_MS);
					});
				}

				// The stall check has to be a timer and not a frame callback, because the
				// case it exists for is the one where the frame callback never runs. It
				// also owns the end of the window: if frames have stopped, askForFrame is
				// parked inside a rAF that will never fire and could not close it.
				var frameWatch = setInterval(function () {
					if (Date.now() - t0 >= FRAME_WINDOW_MS) {
						clearInterval(frameWatch);
						sampling = false;
						// Nobody is there to have a launch measured; m=end already went.
						if (!ended) report('fr');
						return;
					}
					if (!awaitingFrame) return;
					// A hidden document is not being drawn and is not supposed to be. That
					// is m=end's story, not this one.
					if (document.visibilityState !== 'visible') return;
					if (Date.now() - frameAskedAt < STALL_MS) return;
					noteGap();
					if (stallReported) return;
					stallReported = true;
					report('stall');
				}, 500);

				askForFrame();

				// Bounded, because m=show made this the one beacon a reader can produce on
				// demand: an afternoon of switching between apps would otherwise write an
				// unbounded number of lines into the access log, and by the tenth round
				// whatever the pattern was going to say it has said.
				var PAIR_CAP = 10;
				var pairs = 0;

				function end() {
					if (ended || pairs >= PAIR_CAP) return;
					ended = true;
					pairs++;
					report('end');
				}

				// The other half of m=end. Reported only when an m=end has gone before it,
				// which keeps a launch that was visible throughout at no cost, makes the
				// two a matched pair in the log, and means the duplicate notification a
				// bfcache restore produces (pageshow *and* visibilitychange) reports once.
				function show(persisted) {
					// Time spent in the background is not time a visible document was left
					// undrawn, so the frame clock restarts here rather than counting it.
					frameAskedAt = Date.now();
					if (!ended) return;
					ended = false;
					report('show', persisted ? 'bfcache' : null);
				}

				document.addEventListener('visibilitychange', function () {
					if (document.visibilityState === 'hidden') {
						everHidden = true;
						end();
					} else {
						show(false);
					}
				});

				// Both pairs, because neither is reliable alone on a phone: pagehide is
				// skipped when the OS takes the app away without a navigation, and
				// visibilitychange does not fire on some same-tab navigations. `persisted`
				// is also the only thing that names a bfcache restore, and a bfcache
				// restore is precisely what "Back, and the articles were instantly there"
				// would be — a page that was never lost, only stopped being shown.
				window.addEventListener('pagehide', end);
				window.addEventListener('pageshow', function (event) {
					if (event.persisted) everHidden = true;
					show(!!event.persisted);
				});

				var observer = new MutationObserver(tick);

				function tick() {
					check();
					// Rides along so an overlay built before <body> existed is moved into
					// it as soon as it appears.
					render();
				}

				function el(tag, cls, text) {
					var node = document.createElement(tag);
					if (cls) node.className = cls;
					if (text) node.textContent = text;
					return node;
				}

				function build() {
					var root = el('div');
					root.id = 'boot';

					var loading = el('div', 'boot-panel boot-loading');
					loading.appendChild(el('div', 'boot-spinner'));
					var loadingText = el('p', null, 'Loading…');
					loadingText.setAttribute('aria-live', 'polite');
					loading.appendChild(loadingText);

					var failed = el('div', 'boot-panel boot-failed');
					failed.appendChild(el('p', null, 'The app didn’t finish loading.'));
					detailNode = el('p', 'boot-detail', CHUNK_DETAIL);
					failed.appendChild(detailNode);
					var button = el('button', null, 'Reload');
					button.type = 'button';
					button.onclick = function () {
						location.reload();
					};
					failed.appendChild(button);

					root.appendChild(loading);
					root.appendChild(failed);
					return root;
				}

				// Every write here is guarded by a read. The overlay lives inside the
				// subtree the observer is watching, and assigning textContent replaces a
				// child node — so an unconditional write would re-trigger the observer,
				// which calls render() again, forever.
				//
				// This is what the stub's timers call once this script has parsed, so
				// the transition into the failed state is handled here rather than in
				// the timer: the stub only knows that ten seconds have passed.
				function render() {
					if (finished) return;
					if (b.s === 2 && failDetail === null) {
						// Give the app a last chance to be found before blaming it: an
						// error can arrive in the same task as the render that resolves it.
						check();
						if (finished) return;
						// Still parsing after all this time means the document itself never
						// finished arriving, which is a different story to tell than a
						// module that went missing. Latched, because the observer calls
						// render() again and readyState will have moved on by then.
						failDetail =
							b.d || (document.readyState === 'loading' ? DOCUMENT_DETAIL : CHUNK_DETAIL);
						b.stop();
					}
					if (b.s === 0) return;
					// The stub's bare fallback, if its 500ms timer beat this script into
					// the document. Replaced rather than left underneath.
					if (b.drop) {
						b.drop();
						b.drop = null;
					}
					if (!boot) boot = build();
					var detail = failDetail || CHUNK_DETAIL;
					if (detailNode.textContent !== detail) detailNode.textContent = detail;
					var cls = b.s === 2 ? 'showing failed' : 'showing';
					if (boot.className !== cls) boot.className = cls;
					// <body> may not exist yet, and may appear after we first needed to
					// paint; appendChild moves the overlay across when it does.
					var parent = document.body || document.documentElement;
					if (boot.parentNode !== parent) parent.appendChild(boot);
				}

				// Reporting an error is unconditional; taking the screen back for it is
				// not. Before the app is up there is nothing on screen to protect, so
				// the overlay wins outright. After it is up, covering a working page
				// with "the app didn't finish loading" over a 404ed summary image
				// would be its own bug — so the overlay returns only when what is on
				// screen has stopped being true: nothing rendered at all, or a loading
				// panel still promising articles that have already failed to arrive.
				//
				// That second case is the one worth having. A throw while rendering
				// the article tree — one unguarded field in a response that arrived
				// malformed is enough — is caught by nothing: it is not a rejected
				// promise, so the page's {#await} never sees it, and done() has long
				// since bowed out. Both engines leave the loading panel in place and
				// spin forever, which is indistinguishable from a slow network and
				// stays that way until the reader gives up.
				function fail(text) {
					report('err', text);
					if (finished) {
						if (rendered() && !b.busy) return;
						// Put the machinery back the way it was before done() retired it.
						finished = false;
						lied = b.busy;
						boot = null;
						detailNode = null;
						failDetail = null;
						observer.observe(document.documentElement, { childList: true, subtree: true });
					}
					if (text) b.d = text;
					b.s = 2;
					render();
				}

				function done() {
					finished = true;
					b.stop();
					if (b.drop) {
						b.drop();
						b.drop = null;
					}
					observer.disconnect();
					if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
					// Later loading panels time themselves from scratch.
					window.__bootSpinnerShown = false;
					report('app');
					// Deliberately after the render rather than with it: what this asks
					// is not "did the app build a tree" — done() already knows that —
					// but "did the browser then draw it".
					requestAnimationFrame(function () {
						painted++;
						report('up');
					});
				}

				// The app has taken over once it has rendered something that occupies
				// space. Requiring layout rather than merely an element matters because
				// a mounted-but-empty tree looks exactly like the blank page we are
				// here to report. #app also holds SvelteKit's inline bootstrap
				// <script>, hence the skip.
				function rendered() {
					var app = document.getElementById('app');
					if (!app) return false;
					var kids = app.children;
					for (var i = 0; i < kids.length; i++) {
						if (kids[i].tagName === 'SCRIPT') continue;
						if (kids[i].getBoundingClientRect().height > 0) return true;
					}
					return false;
				}

				function check() {
					if (finished) return;
					// A loading panel that has already been caught lying is not evidence
					// the app is up. Hold the overlay until the app replaces it with
					// something else — which is also how it takes the screen back if it
					// does recover.
					if (lied && b.busy) return;
					if (rendered()) done();
				}

				// A failed dynamic import in SvelteKit's bootstrap surfaces here and
				// nowhere else — that Promise.all has no .catch() of its own.
				window.addEventListener('unhandledrejection', function (event) {
					var reason = event.reason;
					fail(reason && reason.message ? String(reason.message) : null);
				});

				// Capture phase, because resource load failures don't bubble. Narrowed
				// to the module graph: a summary's image 404ing is not a dead app.
				window.addEventListener(
					'error',
					function (event) {
						var target = event.target;
						if (target && target !== window && target.tagName) {
							var tag = target.tagName;
							if (tag !== 'SCRIPT' && !(tag === 'LINK' && target.rel === 'modulepreload')) return;
							fail('Could not load ' + (target.src || target.href || tag.toLowerCase()) + '.');
						} else {
							fail(event.message ? String(event.message) : null);
						}
					},
					true
				);

				// Take over from the stub's fallback renderer. From here its timers
				// drive the overlay below rather than the bare div above.
				b.render = render;

				// #app does not exist yet, so watch the document and look it up lazily.
				// Every render() call also rides along, which is how the overlay reaches
				// <body> if it had to be built before <body> existed.
				observer.observe(document.documentElement, { childList: true, subtree: true });
				// Prerendered pages (/login, /about) may already be in place.
				document.addEventListener('DOMContentLoaded', check);
				check();
				// Catch up on anything the stub decided before this script parsed — on
				// a slow document that can already be the spinner, or the failure.
				render();
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
