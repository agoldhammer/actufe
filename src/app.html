<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<style>
			/*
				The boot skeleton. With `ssr = false` this file is the only markup the
				server sends, so between the first byte and the app's first render there
				is otherwise nothing on screen at all. On a phone that gap is the module
				downloads plus their execution — seconds, sometimes — and if a chunk
				never arrives it is permanent, with no error and no way out but the
				browser's own controls.

				It overlays rather than sits in the flow, so removing it can't shift the
				app's layout, and its geometry mirrors ActuStatus/.pagewrapper so the
				handoff to the app is not a visible change of shape.
			*/
			#boot {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: #fff;
				font-family: Verdana, Geneva, Tahoma, sans-serif;
				color: #333;
				/* Held back so a fast load never flashes a spinner; ActuStatus uses the
				   same threshold and picks the wait up where this leaves off. */
				opacity: 0;
				pointer-events: none;
			}

			#boot.showing {
				opacity: 1;
			}

			#boot .boot-panel {
				display: none;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				text-align: center;
				padding: 1rem;
				max-width: 800px;
			}

			#boot.showing .boot-loading,
			#boot.failed .boot-failed {
				display: flex;
			}

			/* Once we have given up, the loading panel is a lie — replace it. */
			#boot.failed {
				pointer-events: auto;
			}

			#boot.failed .boot-loading {
				display: none;
			}

			#boot p {
				margin: 0;
				font-size: 0.9rem;
				color: #6b6b6b;
			}

			#boot .boot-detail {
				font-size: 0.75rem;
				max-width: 40ch;
			}

			#boot .boot-spinner {
				width: 28px;
				height: 28px;
				border: 3px solid #c8c3c5;
				border-top-color: #9a031e;
				border-radius: 50%;
				animation: boot-spin 0.9s linear infinite;
			}

			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}

			#boot button {
				border: none;
				border-radius: 8px;
				background-color: #9a031e;
				color: #fff;
				font-size: 0.8rem;
				padding: 6px 14px;
				cursor: pointer;
			}

			@media (prefers-reduced-motion: reduce) {
				#boot .boot-spinner {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot">
			<div class="boot-panel boot-loading">
				<div class="boot-spinner"></div>
				<p aria-live="polite">Loading…</p>
			</div>
			<div class="boot-panel boot-failed">
				<p>The app didn’t finish loading.</p>
				<p class="boot-detail">
					Some of it never arrived — usually a dropped connection. Reloading normally fixes it.
				</p>
				<button type="button" onclick="location.reload()">Reload</button>
			</div>
		</div>
		<div id="app" style="display: contents">%sveltekit.body%</div>
		<script>
			// Watchdog for the boot skeleton above.
			//
			// The app's own loading and error states (ActuStatus) can only help once
			// the app is running. Nothing covered the case where it never starts: the
			// shell's bootstrap does `Promise.all([import(...), import(...)]).then(...)`,
			// so a single chunk that fails to load leaves that promise forever pending
			// — no error, no handler, nothing on screen. This is the only thing that
			// can report that, because it is the only script that already ran.
			(function () {
				// Matches the threshold in Components/ActuStatus.svelte.
				var SPINNER_AFTER_MS = 500;
				var GIVE_UP_AFTER_MS = 10000;

				var boot = document.getElementById('boot');
				var app = document.getElementById('app');
				if (!boot || !app) return;

				var spinnerTimer = setTimeout(function () {
					boot.classList.add('showing');
					// Read once by the first ActuStatus so it doesn't restart the clock
					// and blink the spinner off mid-wait.
					window.__bootSpinnerShown = true;
				}, SPINNER_AFTER_MS);

				var failTimer = setTimeout(function () {
					boot.classList.add('showing', 'failed');
				}, GIVE_UP_AFTER_MS);

				var observer = new MutationObserver(check);

				function done() {
					clearTimeout(spinnerTimer);
					clearTimeout(failTimer);
					observer.disconnect();
					if (boot.parentNode) boot.parentNode.removeChild(boot);
					// Later loading panels time themselves from scratch.
					window.__bootSpinnerShown = false;
				}

				function check() {
					// The app has taken over as soon as it has rendered a real element.
					// #app already holds SvelteKit's inline bootstrap <script>, which is
					// why this looks for anything that isn't one.
					if (app.querySelector(':scope > :not(script)')) done();
				}

				observer.observe(app, { childList: true, subtree: true });
				// Prerendered pages (/login, /about) already have their markup here.
				check();
			})();
		</script>
	</body>
</html>
