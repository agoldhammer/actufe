# actufe site config — serve the static SPA build and proxy the API to actuproxy.
#
# LIVE on con1 as https://nooz.ghmr.net (deployed 2026-07-17): the upstream,
# server_name, root, and location blocks below live in (or next to) the
# nooz.ghmr.net server block of /etc/nginx/sites-available/noozeconf
# (certbot-managed TLS, 80→443 redirect). The gzip/no-cache/asset-404 blocks
# added 2026-07-20 are confirmed live as of 2026-08-08.
#
# HTTP/2 (added 2026-08-08): the live 443 listen directives carry the `http2`
# parameter. On nginx 1.18 that is a property of the listening socket, not of
# the server block, so it had to be added to EVERY vhost sharing :443 —
# noozeconf (both www.ghmr.net and nooz/news.ghmr.net), artsite.conf and
# pollsite.conf — or nginx warns "protocol options redefined" and applies it
# socket-wide anyway. Backups: *.bak-20260808-125924 in sites-available.
# The per-server `http2 on;` directive only exists from nginx 1.25.1.
#   listen 443 ssl http2;                    # managed by Certbot
#   listen [::]:443 ssl http2 ipv6only=on;   # managed by Certbot
# Without it the eight /_app module preloads in the SPA shell serialize over
# HTTP/1.1's per-host connection limit, which is a large part of the delay
# before the app's single article fetch can even start on a phone.
# Deploy there: plain `npm run build` (root base path; also emits precompressed
# .gz files), then `rsync -a --delete build/ con1:/var/www/nooz/`. The directory
# is agold-owned and world-readable, so this needs no sudo — do NOT chown it to
# root, that breaks the plain-rsync deploy. A static-content swap needs no nginx
# reload; only config edits do (`nginx -t && systemctl reload nginx`).
#
# On tiny the app is instead served by the altsvr site at http://tiny:8080/news/
# out of /var/www/html/altsvr/news (a real directory owned by agold — NOT a
# symlink into ~agold: nginx runs as www-data, which can't traverse /home/agold,
# so a symlink 404s). Since it's served from the /news subpath there, the build
# MUST set the base path or /_app/* asset URLs resolve to the server root and 404:
#   npm run build:tiny            # pins BASE_PATH=/news
#   rsync -a --delete ~/Prog/actufe/build/ /var/www/html/altsvr/news/
# The app requests the API at ${base}/api/articles, so altsvr needs the
# matching location (remote deploy: proxy to the public endpoint — NOT
# news.ghmr.net, which is the old Netlify frontend, not the API):
#   location = /news/api/articles {
#       proxy_pass https://www.ghmr.net/actu/api/v1/;
#       proxy_ssl_server_name on;
#   }

# actuproxy runs on con1 under supervisor (actur-cloud.conf) at 127.0.0.1:33433,
# exposed publicly as https://www.ghmr.net/actu/api/v1/. The upstream block
# enables connection keepalive to it; it must sit outside the server block
# (sites-available files are included at http{} level, so this placement works).
upstream actuproxy {
    server 127.0.0.1:33433;
    keepalive 8;
}

# /api/articles is reachable by anyone: the app's login page is a client-side
# gate (see src/routes/login/+page.svelte) and does not protect the endpoint,
# so a bare curl gets the full dataset. The content is aggregated public news
# and there is no write path, so the exposure that matters is cost, not
# secrecy — an unthrottled proxy lets a scraper burn con1's bandwidth and
# actuproxy's upstream quota. 1r/s sustained is far above what a reader
# generates (one fetch per navigation) and far below what a scraper wants.
# Must sit at http{} level, like the upstream block above.
limit_req_zone $binary_remote_addr zone=actuapi:1m rate=60r/m;

# Boot telemetry (see location = /_b below). Its own zone rather than a share
# of actuapi's: a launch that is failing in a loop must not be able to spend
# the article budget reporting it, and a beacon being throttled must not read
# as the API being throttled. Four beacons is a healthy launch (app, up, fr,
# end), so 60r/m with a burst leaves room for a reload or two without ever
# being reached. m=show is the only one a reader can drive on demand, by
# leaving and coming back, and the watchdog stops pairing after ten rounds.
limit_req_zone $binary_remote_addr zone=bootbeacon:1m rate=60r/m;

# The access log is the whole storage layer for the boot telemetry, so it is
# worth the one field it has always been missing. $request_time is how long
# nginx spent on the request, and the reason it is here is /api/articles: a
# launch that renders late is the thing under investigation, and without this
# there is no way to tell a slow phone from a slow upstream. Applied to the
# nooz server only (see access_log below), so the shared log keeps its
# combined layout for every other vhost and the new field simply trails the
# nooz lines — every existing grep reads fields from the left and is unaffected.
log_format noozed '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  '$request_time';

server {
    listen 80;
    server_name nooz.ghmr.net;          # on con1; TLS handled by certbot in noozeconf
    root /var/www/nooz;                 # contents of build/

    # Serve the .gz files precompressed by the build, and gzip on the fly
    # what has no precompressed twin (mainly the proxied article JSON).
    gzip_static on;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Same file as everything else, so a launch's beacons still sit next to the
    # /api/articles request they belong with; only the format differs.
    access_log /var/log/nginx/access.log noozed;

    # API: replaces the old Netlify connProxy function.
    # actuproxy serves at its root, so /api/articles?q maps to /?q
    # (the query string is forwarded automatically). Bare calls without params
    # fall through to actuproxy's own defaults (the old connProxy defaulted
    # timeframe=0&timewindow=2; the SPA always sends both, so this only
    # affects hand-written curl calls).
    location = /api/articles {
        # burst absorbs a reader clicking time-travel or a category several
        # times in a row; nodelay serves those immediately rather than queueing
        # them behind the 1r/s drip. 429 rather than nginx's default 503, so a
        # throttled client can tell rate limiting from a backend outage.
        limit_req zone=actuapi burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://actuproxy/;
        proxy_http_version 1.1;         # required for upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Boot telemetry from the watchdog in src/app.html. Everything about a
    # failed launch happens on a phone with no console and no way to report
    # what it saw, so the app says it here instead: the query string carries
    # which milestone it reached, how long it took, and whether the document
    # was ever hidden. nginx has nothing to do but log it.
    #
    #   m=app    the app rendered something with a height
    #   m=up     a frame was painted after that render
    #   m=err    an error or rejection, at any point (d= carries it)
    #   m=end    the reader left, or the OS took the app away
    #   m=show   it came back; only ever after an m=end, so the two pair up.
    #            d=bfcache means the page was restored whole rather than reloaded
    #   m=fr     the 15s frame sampler closed with the reader still here
    #   m=stall  a *visible* document went 1.5s without being drawn
    #
    # m=stall and the g= field are the ones that matter: they answer what
    # m=app and m=up between them could not, which is whether a launch that
    # rendered and painted went on being put on screen at all. See the
    # 21:30:05Z launch of 18 Aug 2026, which reported app and up, raised no
    # error, and showed its reader plain white.
    #
    # 204 rather than 200: sendBeacon wants no body, and an empty 200 would be
    # cached by something eventually. No proxy_pass, no disk, no upstream — the
    # access log is the whole storage layer, which is also why this must not be
    # excluded from it.
    location = /_b {
        limit_req zone=bootbeacon burst=10 nodelay;
        limit_req_status 429;
        return 204;
    }

    # Hashed build assets: cache forever. A missing asset (stale shell after a
    # redeploy, probe) is a plain 404, never the SPA shell.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @asset404;
    }
    location /_app/ {
        error_page 404 = @asset404;
    }
    location @asset404 { return 404; }

    # The SPA shell must always be revalidated: a heuristically cached
    # index.html keeps referencing /_app/immutable chunks pruned by the next
    # redeploy, which blanks the app. (src/service-worker.ts now solves the same
    # problem properly for anyone it controls, by keeping a build's shell and
    # that build's chunks in one versioned cache — but this header is still what
    # protects the first launch, and every launch after an unregistration.)
    #
    # `always` is load-bearing, not decoration. add_header applies only to a
    # short list of 2xx/3xx statuses unless it is present, and the shell is
    # served with status 404 on the deep-link fallback below (error_page 404
    # internally redirects here, which does re-match this exact location, but
    # the status stays 404). Without `always` that response went out with no
    # Cache-Control at all — heuristically cacheable, i.e. precisely the stale
    # shell this block exists to prevent. `/` was never affected: the index
    # module's internal redirect lands here with a 200.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Static files. Prerendered pages are found via $uri.html (/login →
    # login.html, /about → about.html), so hard reloads of app routes work
    # without a hand-maintained allowlist; anything unknown is a real 404.
    #
    # login.html and about.html are shells too — each carries a dozen
    # /_app/immutable references, so a heuristically cached copy 404s on pruned
    # chunks after a redeploy and blanks exactly like a stale index.html would.
    # try_files serves them by internal *file* lookup, which does NOT re-run
    # location matching, so the `= /index.html` block above never sees them and
    # the header has to live here. /login is the entry point for anyone without
    # the auth flag, which makes it the worst one to leave stale.
    #
    # This also sweeps in the unhashed root files (favicon*, robots.txt,
    # site.webmanifest, the chrome/apple icons): 8 small files that now
    # revalidate instead of being heuristically cached. Deliberate — they are
    # cheap 304s on an already-open HTTP/2 connection, and scoping them back
    # out with an extension regex would take precedence over the
    # /_app/immutable/ prefix location and silently demote the hashed assets
    # (including the bundled logo png) from immutable.
    #
    # service-worker.js is the ninth, and the one that must not be got wrong.
    # It falls in here because it is unhashed and sits at the root, and the
    # no-cache above is exactly what it needs: the browser re-fetches it, sees
    # bytes that differ (the build version is compiled into it), and installs
    # the new build. Serve it with a long max-age instead and a phone stops
    # noticing deploys entirely — the worker it already has keeps answering
    # every launch out of its precache, and nothing on the site can dislodge it.
    # Do not move it under a regex location, do not add an expires directive
    # that reaches it, and do not restrict the no-cache to text/html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the SPA shell as the 404 body: status is 404, but the client-side
    # router still renders the app's "404 Page not found" page.
    error_page 404 /index.html;
}
